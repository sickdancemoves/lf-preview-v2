<header class="header">
  <a class="header__logo" href="/">
    <img src="assets/logo-white.svg" alt="LaFinteca" class="header__logo-img">
  </a>
  <nav class="header__menu">
    <a data-page="contapj" href="/contapj/">Conta PJ</a>
    <a data-page="about" href="/about/"><span data-lang="pt">Sobre nós</span><span data-lang="en">About us</span></a>
    <span class="header__menu-spacer" aria-hidden="true"></span>
    <a data-page="contact" href="/contact/"><span data-lang="pt">Atendimento</span><span data-lang="en">Support</span></a>
    <a data-page="faqs" href="/faqs/">FAQs</a>
  </nav>
  <div class="header__actions">
    <div class="lang-switch" id="langSwitch">
      <button class="lang-switch__toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
        <svg class="lang-switch__globe" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span class="lang-switch__current" id="langCurrent">PT</span>
        <span class="lang-switch__caret">▾</span>
      </button>
      <ul class="lang-switch__menu" role="listbox">
        <li><button type="button" class="lang-switch__option" data-lang-set="pt" role="option">PT</button></li>
        <li><button type="button" class="lang-switch__option" data-lang-set="en" role="option">EN</button></li>
      </ul>
    </div>
    <button class="login-btn" onclick="location.href='https://ibk-v2-stg.conta.la-finteca.com.br/'"><span data-lang="pt">Entrar</span><span data-lang="en">Log in</span></button>
    <button class="login-btn login-btn--primary" onclick="location.href='/abrir-conta/'"><span data-lang="pt">Abrir Conta PJ</span><span data-lang="en">Open Conta PJ</span></button>
  </div>
  <button class="header__hamburger" id="headerHamburger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobileDrawer">
    <span class="header__hamburger-line"></span>
    <span class="header__hamburger-line"></span>
    <span class="header__hamburger-line"></span>
  </button>
</header>
<div class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
  <nav class="mobile-drawer__nav">
    <a class="mobile-drawer__link" data-page="contapj" href="/contapj/">Conta PJ</a>
    <a class="mobile-drawer__link" data-page="about" href="/about/"><span data-lang="pt">Sobre nós</span><span data-lang="en">About us</span></a>
    <a class="mobile-drawer__link" data-page="contact" href="/contact/"><span data-lang="pt">Atendimento</span><span data-lang="en">Support</span></a>
    <a class="mobile-drawer__link" href="/faqs/">FAQs</a>
    <a class="mobile-drawer__link" href="/politicas/"><span data-lang="pt">Centro de Políticas</span><span data-lang="en">Policy Center</span></a>
  </nav>
  <div class="mobile-drawer__lang">
    <button type="button" class="mobile-drawer__lang-btn" data-lang-set="pt">PT</button>
    <span aria-hidden="true">·</span>
    <button type="button" class="mobile-drawer__lang-btn" data-lang-set="en">EN</button>
  </div>
  <div class="mobile-drawer__actions">
    <button class="btn btn-ghost mobile-drawer__btn" type="button" onclick="location.href='https://ibk-v2-stg.conta.la-finteca.com.br/'"><span><span data-lang="pt">Entrar</span><span data-lang="en">Log in</span></span></button>
    <button class="btn btn-green mobile-drawer__btn" onclick="location.href='/abrir-conta/'" type="button"><span><span data-lang="pt">Abrir Conta PJ</span><span data-lang="en">Open Conta PJ</span></span></button>
  </div>
</div>
